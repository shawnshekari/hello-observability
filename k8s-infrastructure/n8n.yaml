apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        # 1. Tell n8n to turn on OpenTelemetry
        - name: N8N_OTEL_ENABLED
          value: "true"
        # 2. Point it to OTel Collector in observability namespace (HTTP port 4318)
        - name: N8N_OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://cluster-collector-collector.observability.svc.cluster.local:4318"
        # 3. Ensure it traces execution data
        - name: N8N_EXECUTIONS_DATA_ENV
          value: "all"
        # readinessProbe makes `kubectl rollout status` a real readiness gate
        # instead of just "container started" - up.sh relies on this instead
        # of polling the pod IP from outside the cluster (which isn't
        # reachable from a local machine on GKE Autopilot).
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: apps
spec:
  selector:
    app: n8n
  ports:
  - port: 5678
    targetPort: 5678
