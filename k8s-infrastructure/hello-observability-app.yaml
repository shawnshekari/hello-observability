apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-observability-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-observability-app
  template:
    metadata:
      labels:
        app: hello-observability-app
    spec:
      containers:
      - name: hello-observability-app
        image: gcr.io/hellootelworld/hello-observability-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://cluster-collector-collector.observability.svc.cluster.local:4318"
        - name: OTEL_SERVICE_NAME
          value: "hello-observability-app"
        # readinessProbe makes `kubectl rollout status` a real readiness gate
        # instead of just "container started" - up.sh relies on this instead
        # of polling the pod IP from outside the cluster (which isn't
        # reachable from a local machine on GKE Autopilot). initialDelay is
        # generous since the OTel Java agent adds to JVM startup time.
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello-observability-app
  namespace: apps
spec:
  selector:
    app: hello-observability-app
  ports:
  - port: 80
    targetPort: 8080
