# SRE Note: The `googlecloud` exporter needs a Google Service Account bound to this
# collector's Kubernetes ServiceAccount via Workload Identity (GKE Autopilot requires
# Workload Identity; an unbound KSA gets zero IAM grants, it does NOT fall back to the
# node's compute service account). Before/after applying this manifest, run:
#
#   gcloud iam service-accounts create otel-collector-gsa --project=<PROJECT_ID>
#   gcloud projects add-iam-policy-binding <PROJECT_ID> \
#     --member="serviceAccount:otel-collector-gsa@<PROJECT_ID>.iam.gserviceaccount.com" \
#     --role="roles/monitoring.metricWriter"
#   gcloud projects add-iam-policy-binding <PROJECT_ID> \
#     --member="serviceAccount:otel-collector-gsa@<PROJECT_ID>.iam.gserviceaccount.com" \
#     --role="roles/cloudtrace.agent"
#   gcloud iam service-accounts add-iam-policy-binding \
#     otel-collector-gsa@<PROJECT_ID>.iam.gserviceaccount.com \
#     --role="roles/iam.workloadIdentityUser" \
#     --member="serviceAccount:<PROJECT_ID>.svc.id.goog[default/cluster-collector-collector]"
#   kubectl annotate serviceaccount cluster-collector-collector -n default \
#     iam.gke.io/gcp-service-account=otel-collector-gsa@<PROJECT_ID>.iam.gserviceaccount.com
#
# See ISSUE.md #1 for the full incident writeup. The KSA name above (`cluster-collector-collector`)
# is auto-generated by the OTel Operator as `<metadata.name>-collector`.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: cluster-collector
  namespace: default
spec:
  mode: deployment
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:latest
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Scrape metrics from all components
      prometheus:
        config:
          scrape_configs:
            # Camunda Zeebe Broker metrics (workflow execution metrics)
            - job_name: 'camunda-zeebe'
              scrape_interval: 15s
              metrics_path: '/actuator/prometheus'
              static_configs:
                - targets: ['camunda-poc-zeebe-0.camunda-poc-zeebe.camunda.svc.cluster.local:9600']

            # Camunda Operate metrics (workflow instance tracking)
            - job_name: 'camunda-operate'
              scrape_interval: 15s
              metrics_path: '/actuator/prometheus'
              static_configs:
                - targets: ['camunda-poc-operate-0.camunda-poc-operate.camunda.svc.cluster.local:8080']

            # Spring Boot app metrics (custom business metrics)
            - job_name: 'hello-observability-app'
              scrape_interval: 15s
              metrics_path: '/actuator/prometheus'
              static_configs:
                - targets: ['hello-observability-app.default.svc.cluster.local:8080']

    exporters:
      googlecloud:
        project: "hellootelworld"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [googlecloud]
        metrics:
          receivers: [prometheus]
          exporters: [googlecloud]
