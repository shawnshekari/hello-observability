global:
  elasticsearch:
    enabled: true
  identity:
    auth:
      enabled: false

zeebe:
  clusterSize: 1
  partitionCount: 1
  replicationFactor: 1

zeebe-gateway:
  replicas: 1
  # Satisfy GKE Autopilot minimum CPU requirements
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi

operate:
  enabled: true
tasklist:
  enabled: false
optimize:
  enabled: false
identity:
  enabled: false
identityKeycloak:
  enabled: false
# Connectors runtime executes outbound connector job types (e.g. the REST
# connector, io.camunda:http-json:1) that BPMN service tasks declare. It's
# a separate deployment that polls Zeebe for those job types.
connectors:
  enabled: true
  # inbound.mode defaults to "oauth" in this chart, which is for connectors
  # that receive inbound webhooks and needs Identity/Keycloak to validate
  # them. This PoC only uses outbound connectors (Camunda calling out to
  # n8n), and identity/identityKeycloak are disabled above, so inbound is
  # explicitly turned off rather than left on an auth mode with nothing to
  # authenticate against.
  inbound:
    mode: disabled
# Operate requires Elasticsearch as its data backend - its schema-migration
# init container fails outright without it (ISSUE.md #2 addendum). Sized down
# hard from the chart's 3-node default for a PoC: a single master node with
# data.replicaCount left at 0 takes on the combined master+data role, which is
# this chart's standard pattern for a minimal single-node cluster. Requires
# the ComputeClass in k8s-infrastructure/elasticsearch-computeclass.yaml to
# already exist - see that file for why (GKE Autopilot's vm.max_map_count
# constraint).
elasticsearch:
  enabled: true
  # Bitnami's chart also ships a legacy sysctl-fix initContainer that runs
  # privileged: true / runAsUser: 0 to set vm.max_map_count itself - GKE
  # Autopilot rejects privileged containers outright, so this would block
  # pod admission entirely. The ComputeClass already sets the sysctl at the
  # node level (the Autopilot-native mechanism), making this both redundant
  # and actively harmful here.
  sysctlImage:
    enabled: false
  master:
    replicaCount: 1
    nodeSelector:
      cloud.google.com/compute-class: elasticsearch
  data:
    replicaCount: 0
