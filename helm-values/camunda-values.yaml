global:
  elasticsearch:
    enabled: false
  identity:
    auth:
      enabled: false

zeebe:
  clusterSize: 1
  partitionCount: 1
  replicationFactor: 1

zeebe-gateway:
  replicas: 1
  # NEW BLOCK: Satisfy GKE Autopilot minimum CPU requirements
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi

operate:
  enabled: false
tasklist:
  enabled: false
optimize:
  enabled: false
identity:
  enabled: false
identityKeycloak:
  enabled: false
connectors:
  enabled: false
elasticsearch:
  enabled: false
